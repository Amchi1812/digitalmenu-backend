services:
  postgres:
    image: postgres:16
    container_name: digital_menu_postgres
    restart: always
    environment:
      POSTGRES_USER: amerzec
      POSTGRES_PASSWORD: amerzecsql
      POSTGRES_DB: restaurant_menu_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: